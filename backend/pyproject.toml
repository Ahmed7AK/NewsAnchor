[project]
name = "newsanchor"
version = "0.1.0"
description = "A daily news feed assembled for balanced exposure and source diversity"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "feedparser>=6.0.11",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "numpy>=2.0",
    "python-dateutil>=2.9",
    "typer>=0.15",
    "rich>=13.9",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
extract = ["trafilatura>=1.12"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
newsanchor = "newsanchor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["newsanchor"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
