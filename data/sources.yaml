# NewsAnchor source registry
# ---------------------------------------------------------------------------
# This file is the single place where "who do we listen to, and how do we
# weight them" is decided. It is meant to be edited. Disagree with a lean
# value? Change it. The pipeline reads this at runtime; nothing is hardcoded.
#
# lean: integer on a 5-point scale
#   -2 left   -1 lean-left   0 center   +1 lean-right   +2 right
#   null      unrated / not meaningfully placeable on a US left-right axis
#             (most non-US outlets fall here on purpose -- see docs/RESEARCH.md)
#
# IMPORTANT, please read:
#   The `lean` values below are a coarse editorial starting point assembled
#   from the broad consensus of the public bias charts (AllSides, Ad Fontes,
#   Media Bias/Fact Check) as of early 2026. They are NOT licensed data from
#   any of those organisations, and they are not authoritative. They exist so
#   the app has something to balance against out of the box. If you want real
#   ratings, wire up a licensed provider -- see `bias_providers` in config and
#   docs/RESEARCH.md#bias-and-credibility-data.
#
#   A left-right axis is a US-centric lens. It says nothing about accuracy.
#   A source can be dead-center and consistently wrong.
#
# tier:
#   wire       - agency copy that gets syndicated verbatim to hundreds of
#                outlets. Deduplicated aggressively; does not count toward
#                "independent corroboration".
#   national   - general-interest national outlet
#   magazine   - opinion-forward long-form
#   nonprofit  - nonprofit / public-service newsroom
#   intl       - non-US outlet, included for perspective diversity
#
# state_affiliated: outlet is funded/controlled by a national government in a
#   way that materially constrains its editorial line. These are DISABLED by
#   default. Turn them on if you want to see them, but they are labelled
#   loudly in the UI. Note this flag is about editorial control, not funding
#   alone -- BBC and NPR receive public money and are not flagged.
#
# feeds: RSS/Atom URLs. Verify them on your own machine with:
#     newsanchor sources check
#   Feed URLs rot constantly (outlets move or kill them without notice) and
#   the URLs below could not be validated from the environment this repo was
#   authored in. Expect a few to be dead on first run.

sources:
  # -- Wire services ---------------------------------------------------------
  # AP and Reuters both retired their general public RSS feeds. What is left
  # is partial. They are still listed because their copy dominates syndication
  # and the deduper needs to know who they are.
  - id: ap
    name: Associated Press
    homepage: https://apnews.com
    lean: 0
    tier: wire
    country: US
    feeds:
      - https://apnews.com/hub/ap-top-news.rss
    notes: >
      AP killed its classic RSS endpoints. This hub feed is unofficial and may
      break. AP's own Content API is enterprise-priced. See docs/RESEARCH.md.

  - id: reuters
    name: Reuters
    homepage: https://www.reuters.com
    lean: 0
    tier: wire
    country: GB
    feeds: []
    notes: >
      Reuters shut down public RSS in 2020 and blocks most scraping. Left here
      as a known wire signature for deduplication -- syndicated Reuters copy is
      detected via bylines/credit lines, not fetched directly.

  - id: afp
    name: Agence France-Presse
    homepage: https://www.afp.com
    lean: null
    tier: wire
    country: FR
    feeds: []
    notes: Same situation as Reuters. Detected as syndicated credit, not fetched.

